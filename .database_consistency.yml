# Exclusions, each one argued rather than assumed. Everything else database_consistency
# reports is a real gap and is fixed in the schema or the models.
#
# The format is: <Model> > <column> > <Checker> > enabled.

User:
  encrypted_password:
    # Devise writes this; no user input reaches it and its length is fixed by
    # bcrypt (60 characters against a varchar(255)). A length validator here would
    # be a rule about our own hashing library that can never fire.
    LengthConstraintChecker:
      enabled: false

  reset_password_token:
    # Same: generated by Devise.friendly_token, never submitted by anyone.
    LengthConstraintChecker:
      enabled: false

  # Index checkers are keyed by index name, not by column.
  index_users_on_reset_password_token:
    # The checker wants a uniqueness validation to match the unique index. Adding
    # one would break every user save: Active Record's uniqueness validator does
    # NOT skip nil, so the moment a second user has no outstanding reset token the
    # validation fails for both. Devise already guarantees the token's uniqueness
    # when it generates one, and the index is the backstop.
    UniqueIndexChecker:
      enabled: false
